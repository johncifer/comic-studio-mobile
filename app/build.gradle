plugins {
    id 'com.android.application'
}

android {
    namespace 'com.comicstudio'
    compileSdk 34

    defaultConfig {
        applicationId "com.comicstudio.mobile"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // FileProvider（APK 安装桥接）需要 AndroidX core
    implementation 'androidx.core:core:1.13.1'
}
